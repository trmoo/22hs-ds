<svg viewBox="0 0 760 360" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>주제 후보에서 최종 주제까지의 판단 흐름</title>
  <desc>왼쪽에 주제 후보 네 개가 세로로 놓여 있다. 후보는 오른쪽으로 측정 가능성, 데이터 가용성, 결론의 활용이라는 세 관문을 차례로 지난다. 각 관문에서 통과하지 못한 후보는 아래로 빠진다. 아래로 빠진 후보는 범위를 좁히거나 대리 지표로 바꾸어 다시 관문으로 되돌아올 수 있다. 세 관문을 모두 지난 후보가 최종 주제가 된다.</desc>
  <defs>
    <marker id="gate-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--c-primary, #0d7d72)"/>
    </marker>
    <marker id="gate-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--c-warn, #b06a00)"/>
    </marker>
  </defs>

  <!-- 왼쪽: 주제 후보 -->
  <text x="16" y="22" font-size="12.5" font-weight="700" fill="var(--c-text-soft, #4a5768)">주제 후보</text>
  <g>
    <rect x="16" y="32" width="126" height="30" rx="6" fill="var(--c-surface-2, #f1f4f8)" stroke="var(--c-border-strong, #c3ccd8)" stroke-width="1.2"/>
    <text x="79" y="52" text-anchor="middle" font-size="12" fill="var(--c-text, #16202b)">후보 1</text>
    <rect x="16" y="68" width="126" height="30" rx="6" fill="var(--c-surface-2, #f1f4f8)" stroke="var(--c-border-strong, #c3ccd8)" stroke-width="1.2"/>
    <text x="79" y="88" text-anchor="middle" font-size="12" fill="var(--c-text, #16202b)">후보 2</text>
    <rect x="16" y="104" width="126" height="30" rx="6" fill="var(--c-surface-2, #f1f4f8)" stroke="var(--c-border-strong, #c3ccd8)" stroke-width="1.2"/>
    <text x="79" y="124" text-anchor="middle" font-size="12" fill="var(--c-text, #16202b)">후보 3</text>
    <rect x="16" y="140" width="126" height="30" rx="6" fill="var(--c-surface-2, #f1f4f8)" stroke="var(--c-border-strong, #c3ccd8)" stroke-width="1.2"/>
    <text x="79" y="160" text-anchor="middle" font-size="12" fill="var(--c-text, #16202b)">후보 4</text>
  </g>
  <path d="M148,101 L176,101" fill="none" stroke="var(--c-primary, #0d7d72)" stroke-width="2" marker-end="url(#gate-a)"/>

  <!-- 관문 1 -->
  <g>
    <rect x="182" y="56" width="118" height="90" rx="10"
          fill="var(--c-primary-soft, #d6f2ee)" stroke="var(--c-primary, #0d7d72)" stroke-width="1.8"/>
    <text x="241" y="80" text-anchor="middle" font-size="11" fill="var(--c-primary-deep, #0a5f57)">관문 1</text>
    <text x="241" y="100" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--c-text, #16202b)">측정 가능성</text>
    <text x="241" y="120" text-anchor="middle" font-size="10.5" fill="var(--c-text-soft, #4a5768)">수로 잴 수</text>
    <text x="241" y="134" text-anchor="middle" font-size="10.5" fill="var(--c-text-soft, #4a5768)">있는가</text>
  </g>
  <path d="M306,101 L334,101" fill="none" stroke="var(--c-primary, #0d7d72)" stroke-width="2" marker-end="url(#gate-a)"/>

  <!-- 관문 2 -->
  <g>
    <rect x="340" y="56" width="118" height="90" rx="10"
          fill="var(--c-primary-soft, #d6f2ee)" stroke="var(--c-primary, #0d7d72)" stroke-width="1.8"/>
    <text x="399" y="80" text-anchor="middle" font-size="11" fill="var(--c-primary-deep, #0a5f57)">관문 2</text>
    <text x="399" y="100" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--c-text, #16202b)">데이터 가용성</text>
    <text x="399" y="120" text-anchor="middle" font-size="10.5" fill="var(--c-text-soft, #4a5768)">지금 구할 수</text>
    <text x="399" y="134" text-anchor="middle" font-size="10.5" fill="var(--c-text-soft, #4a5768)">있는가</text>
  </g>
  <path d="M464,101 L492,101" fill="none" stroke="var(--c-primary, #0d7d72)" stroke-width="2" marker-end="url(#gate-a)"/>

  <!-- 관문 3 -->
  <g>
    <rect x="498" y="56" width="118" height="90" rx="10"
          fill="var(--c-primary-soft, #d6f2ee)" stroke="var(--c-primary, #0d7d72)" stroke-width="1.8"/>
    <text x="557" y="80" text-anchor="middle" font-size="11" fill="var(--c-primary-deep, #0a5f57)">관문 3</text>
    <text x="557" y="100" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--c-text, #16202b)">결론의 활용</text>
    <text x="557" y="120" text-anchor="middle" font-size="10.5" fill="var(--c-text-soft, #4a5768)">결과로 무엇을</text>
    <text x="557" y="134" text-anchor="middle" font-size="10.5" fill="var(--c-text-soft, #4a5768)">바꿀 수 있는가</text>
  </g>
  <path d="M622,101 L650,101" fill="none" stroke="var(--c-primary, #0d7d72)" stroke-width="2.5" marker-end="url(#gate-a)"/>

  <!-- 최종 주제 -->
  <g>
    <rect x="656" y="72" width="88" height="58" rx="10"
          fill="var(--c-accent-soft, #dce7fb)" stroke="var(--c-accent, #1d5fd0)" stroke-width="2"/>
    <text x="700" y="97" text-anchor="middle" font-size="13" font-weight="700" fill="var(--c-text, #16202b)">최종</text>
    <text x="700" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="var(--c-text, #16202b)">주제</text>
  </g>

  <!-- 탈락 경로 -->
  <g fill="none" stroke="var(--c-warn, #b06a00)" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#gate-w)">
    <path d="M241,148 L241,206"/>
    <path d="M399,148 L399,206"/>
    <path d="M557,148 L557,206"/>
  </g>
  <g font-size="10.5" fill="var(--c-warn, #b06a00)" text-anchor="middle">
    <text x="212" y="178">탈락</text><text x="370" y="178">탈락</text><text x="528" y="178">탈락</text>
  </g>

  <!-- 되돌리기 처리 상자 -->
  <rect x="182" y="210" width="434" height="42" rx="9"
        fill="none" stroke="var(--c-warn, #b06a00)" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="399" y="236" text-anchor="middle" font-size="12.5" fill="var(--c-warn, #b06a00)">범위 좁히기 · 대리 지표로 바꾸기</text>

  <!-- 되돌아오는 화살표 -->
  <path d="M182,231 L160,231 L160,101 L176,101"
        fill="none" stroke="var(--c-warn, #b06a00)" stroke-width="1.8"
        stroke-dasharray="6 4" marker-end="url(#gate-w)"/>
  <text x="156" y="196" text-anchor="end" font-size="10.5" fill="var(--c-warn, #b06a00)">
    <tspan x="156" dy="0">고쳐서</tspan>
    <tspan x="156" dy="14">다시</tspan>
  </text>

  <!-- 아래 결론 -->
  <line x1="16" y1="278" x2="744" y2="278" stroke="var(--c-border, #dde4ec)" stroke-width="1"/>
  <text x="16" y="304" font-size="13" fill="var(--c-text, #16202b)">
    <tspan x="16" dy="0">탈락은 주제를 버리라는 뜻이 아니다. 범위를 좁히거나 대신 잴 지표를 찾으면 다시 후보가 된다.</tspan>
    <tspan x="16" dy="21">세 관문을 모두 지난 주제만 남기는 까닭은, 끝까지 해낼 수 있는 주제를 고르기 위해서다.</tspan>
  </text>
</svg>
