<svg viewBox="0 0 760 340" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>정형 데이터와 비정형 데이터의 비교</title>
  <desc>왼쪽은 정형 데이터로, 학생 번호·과목·점수라는 열 이름이 붙은 표 한 개가 놓여 있다. 값이 정해진 칸에 들어가 있어 열을 기준으로 곧바로 계산할 수 있다. 오른쪽은 비정형 데이터로, 사진 파일, 음성 파형, 자유 형식으로 쓴 글이 놓여 있다. 미리 정해진 칸이 없어 먼저 특징을 뽑아 수치로 바꾸어야 계산할 수 있다.</desc>

  <!-- 왼쪽: 정형 데이터 -->
  <text x="16" y="24" font-size="15" font-weight="700" fill="var(--c-primary-deep, #0a5f57)">정형 데이터</text>
  <text x="16" y="44" font-size="12" fill="var(--c-text-soft, #4a5768)">칸과 열 이름이 미리 정해져 있다</text>

  <g stroke="var(--c-border-strong, #c3ccd8)" stroke-width="1">
    <rect x="16" y="58" width="330" height="150" rx="8"
          fill="var(--c-surface, #ffffff)" stroke="var(--c-primary, #0d7d72)" stroke-width="1.5"/>
    <!-- 머리글 -->
    <rect x="16" y="58" width="330" height="32" rx="8" fill="var(--c-primary-soft, #d6f2ee)" stroke="none"/>
    <rect x="16" y="82" width="330" height="8" fill="var(--c-primary-soft, #d6f2ee)" stroke="none"/>
    <line x1="16" y1="90" x2="346" y2="90" stroke="var(--c-primary, #0d7d72)" stroke-width="1.5"/>
    <line x1="126" y1="58" x2="126" y2="208"/>
    <line x1="256" y1="58" x2="256" y2="208"/>
    <line x1="16" y1="130" x2="346" y2="130"/>
    <line x1="16" y1="169" x2="346" y2="169"/>
  </g>
  <g font-size="13" fill="var(--c-primary-deep, #0a5f57)" font-weight="700" text-anchor="middle">
    <text x="71" y="80">학생 번호</text>
    <text x="191" y="80">과목</text>
    <text x="301" y="80">점수</text>
  </g>
  <g font-size="13" fill="var(--c-text, #16202b)" text-anchor="middle">
    <text x="71" y="115">101</text><text x="191" y="115">수학</text><text x="301" y="115">88</text>
    <text x="71" y="154">102</text><text x="191" y="154">수학</text><text x="301" y="154">75</text>
    <text x="71" y="193">103</text><text x="191" y="193">수학</text><text x="301" y="193">92</text>
  </g>
  <text x="16" y="234" font-size="12.5" fill="var(--c-text-soft, #4a5768)">점수 열의 평균을 그대로 구할 수 있다.</text>

  <!-- 가운데 구분선 -->
  <line x1="380" y1="16" x2="380" y2="256" stroke="var(--c-border, #dde4ec)" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 오른쪽: 비정형 데이터 -->
  <text x="414" y="24" font-size="15" font-weight="700" fill="var(--c-accent, #1d5fd0)">비정형 데이터</text>
  <text x="414" y="44" font-size="12" fill="var(--c-text-soft, #4a5768)">미리 정해진 칸이 없다</text>

  <!-- 사진 아이콘 -->
  <g>
    <rect x="414" y="58" width="100" height="72" rx="6"
          fill="var(--c-surface, #ffffff)" stroke="var(--c-accent, #1d5fd0)" stroke-width="1.5"/>
    <path d="M424,116 L448,90 L466,110 L478,98 L504,116 Z"
          fill="var(--c-accent-soft, #dbe7fb)" stroke="var(--c-accent, #1d5fd0)" stroke-width="1.2"/>
    <circle cx="491" cy="78" r="7" fill="none" stroke="var(--c-accent, #1d5fd0)" stroke-width="1.2"/>
    <text x="464" y="146" text-anchor="middle" font-size="12.5" fill="var(--c-text, #16202b)">행사 사진</text>
  </g>
  <!-- 음성 파형 아이콘 -->
  <g>
    <rect x="530" y="58" width="100" height="72" rx="6"
          fill="var(--c-surface, #ffffff)" stroke="var(--c-accent, #1d5fd0)" stroke-width="1.5"/>
    <g stroke="var(--c-accent, #1d5fd0)" stroke-width="3" stroke-linecap="round">
      <line x1="544" y1="88" x2="544" y2="100"/>
      <line x1="554" y1="78" x2="554" y2="110"/>
      <line x1="564" y1="68" x2="564" y2="120"/>
      <line x1="574" y1="82" x2="574" y2="106"/>
      <line x1="584" y1="72" x2="584" y2="116"/>
      <line x1="594" y1="86" x2="594" y2="102"/>
      <line x1="604" y1="76" x2="604" y2="112"/>
      <line x1="614" y1="90" x2="614" y2="98"/>
    </g>
    <text x="580" y="146" text-anchor="middle" font-size="12.5" fill="var(--c-text, #16202b)">안내 방송 녹음</text>
  </g>
  <!-- 자유 형식 글 아이콘 -->
  <g>
    <rect x="646" y="58" width="98" height="72" rx="6"
          fill="var(--c-surface, #ffffff)" stroke="var(--c-accent, #1d5fd0)" stroke-width="1.5"/>
    <g stroke="var(--c-accent, #1d5fd0)" stroke-width="2.5" stroke-linecap="round">
      <line x1="660" y1="76" x2="730" y2="76"/>
      <line x1="660" y1="88" x2="722" y2="88"/>
      <line x1="660" y1="100" x2="732" y2="100"/>
      <line x1="660" y1="112" x2="700" y2="112"/>
    </g>
    <text x="695" y="146" text-anchor="middle" font-size="12.5" fill="var(--c-text, #16202b)">자유 감상문</text>
  </g>

  <text x="414" y="176" font-size="12.5" fill="var(--c-text-soft, #4a5768)">
    <tspan x="414" dy="0">길이도 형식도 자료마다 다르다. 평균을 구하려면</tspan>
    <tspan x="414" dy="19">먼저 셀 수 있는 특징을 뽑아 수치로 바꾸어야 한다.</tspan>
  </text>
  <text x="414" y="234" font-size="12.5" fill="var(--c-text-soft, #4a5768)">얼굴이 드러나는 사진은 소재로 쓰지 않는다.</text>

  <!-- 아래 결론 -->
  <line x1="16" y1="272" x2="744" y2="272" stroke="var(--c-border, #dde4ec)" stroke-width="1"/>
  <text x="16" y="298" font-size="13" fill="var(--c-text, #16202b)">
    <tspan x="16" dy="0">형태가 다르면 저장하는 방법도, 분석을 시작하는 방법도 달라진다.</tspan>
    <tspan x="16" dy="20">그래서 자료를 받으면 먼저 어느 쪽인지 판단한다.</tspan>
  </text>
</svg>
