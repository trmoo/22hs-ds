<svg viewBox="0 0 760 360" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>공통 속성인 학생 번호를 기준으로 두 표를 잇는 과정</title>
  <desc>왼쪽은 동아리 명단 표로 학생 번호 101, 102, 103이 있다. 오른쪽은 교내 대회 참가 기록 표로 학생 번호 101, 103, 104가 있다. 학생 번호가 같은 101과 101, 103과 103이 선으로 이어진다. 명단의 102는 참가 기록이 없어 이을 상대가 없고, 참가 기록의 104는 명단에 없어 이을 상대가 없다. 두 표를 이을 때는 어느 쪽을 기준으로 삼을지 먼저 정해야 한다.</desc>

  <!-- 표 제목 -->
  <text x="16" y="24" font-size="14" font-weight="700" fill="var(--c-primary-deep, #0a5f57)">데이터셋 A · 동아리 명단</text>
  <text x="470" y="24" font-size="14" font-weight="700" fill="var(--c-accent, #1d5fd0)">데이터셋 B · 참가 기록</text>
  <text x="16" y="42" font-size="11.5" fill="var(--c-text-soft, #4a5768)">이름은 가상의 값이다</text>
  <text x="470" y="42" font-size="11.5" fill="var(--c-text-soft, #4a5768)">점수는 가상의 값이다</text>

  <!-- 이어지는 선: 학생 번호가 같은 행끼리 -->
  <g stroke="var(--c-primary, #0d7d72)" stroke-width="2.5" fill="none">
    <path d="M281,111 L469,111"/>
    <path d="M281,189 C340,189 410,150 469,150"/>
  </g>
  <g fill="var(--c-primary, #0d7d72)">
    <circle cx="281" cy="111" r="4"/><circle cx="469" cy="111" r="4"/>
    <circle cx="281" cy="189" r="4"/><circle cx="469" cy="150" r="4"/>
  </g>
  <text x="375" y="103" text-anchor="middle" font-size="11.5" fill="var(--c-primary-deep, #0a5f57)">101 = 101</text>
  <text x="375" y="185" text-anchor="middle" font-size="11.5" fill="var(--c-primary-deep, #0a5f57)">103 = 103</text>

  <!-- 왼쪽 표 -->
  <g stroke="var(--c-border-strong, #c3ccd8)" stroke-width="1">
    <rect x="16" y="60" width="265" height="149" rx="8"
          fill="var(--c-surface, #ffffff)" stroke="var(--c-primary, #0d7d72)" stroke-width="1.5"/>
    <rect x="16" y="60" width="265" height="24" fill="var(--c-primary-soft, #d6f2ee)" stroke="none"/>
    <rect x="16" y="76" width="265" height="8" fill="var(--c-primary-soft, #d6f2ee)" stroke="none"/>
    <line x1="16" y1="84" x2="281" y2="84" stroke="var(--c-primary, #0d7d72)" stroke-width="1.5"/>
    <line x1="102" y1="60" x2="102" y2="209"/>
    <line x1="182" y1="60" x2="182" y2="209"/>
    <line x1="16" y1="131" x2="281" y2="131"/>
    <line x1="16" y1="170" x2="281" y2="170"/>
  </g>
  <!-- 공통 속성 열 강조 -->
  <rect x="16" y="84" width="86" height="125" fill="var(--c-primary, #0d7d72)" opacity="0.09"/>
  <g font-size="12.5" font-weight="700" text-anchor="middle" fill="var(--c-primary-deep, #0a5f57)">
    <text x="59" y="77">학생 번호</text><text x="142" y="77">이름</text><text x="231" y="77">동아리</text>
  </g>
  <g font-size="13" text-anchor="middle" fill="var(--c-text, #16202b)">
    <text x="59" y="116" font-weight="700">101</text><text x="142" y="116">가온</text><text x="231" y="116">데이터반</text>
    <text x="59" y="155" font-weight="700">102</text><text x="142" y="155">나래</text><text x="231" y="155">방송반</text>
    <text x="59" y="194" font-weight="700">103</text><text x="142" y="194">다온</text><text x="231" y="194">데이터반</text>
  </g>

  <!-- 오른쪽 표 -->
  <g stroke="var(--c-border-strong, #c3ccd8)" stroke-width="1">
    <rect x="469" y="60" width="275" height="149" rx="8"
          fill="var(--c-surface, #ffffff)" stroke="var(--c-accent, #1d5fd0)" stroke-width="1.5"/>
    <rect x="469" y="60" width="275" height="24" fill="var(--c-accent-soft, #dbe7fb)" stroke="none"/>
    <rect x="469" y="76" width="275" height="8" fill="var(--c-accent-soft, #dbe7fb)" stroke="none"/>
    <line x1="469" y1="84" x2="744" y2="84" stroke="var(--c-accent, #1d5fd0)" stroke-width="1.5"/>
    <line x1="555" y1="60" x2="555" y2="209"/>
    <line x1="668" y1="60" x2="668" y2="209"/>
    <line x1="469" y1="131" x2="744" y2="131"/>
    <line x1="469" y1="170" x2="744" y2="170"/>
  </g>
  <rect x="469" y="84" width="86" height="125" fill="var(--c-accent, #1d5fd0)" opacity="0.09"/>
  <g font-size="12.5" font-weight="700" text-anchor="middle" fill="var(--c-accent, #1d5fd0)">
    <text x="512" y="77">학생 번호</text><text x="611" y="77">종목</text><text x="706" y="77">점수</text>
  </g>
  <g font-size="13" text-anchor="middle" fill="var(--c-text, #16202b)">
    <text x="512" y="116" font-weight="700">101</text><text x="611" y="116">데이터 분석</text><text x="706" y="116">88</text>
    <text x="512" y="155" font-weight="700">103</text><text x="611" y="155">데이터 분석</text><text x="706" y="155">92</text>
    <text x="512" y="194" font-weight="700">104</text><text x="611" y="194">영상 제작</text><text x="706" y="194">75</text>
  </g>

  <!-- 짝이 없는 행 표시 -->
  <g>
    <path d="M281,150 L316,150" stroke="var(--c-warn, #b06a00)" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="322" y="147" font-size="11.5" fill="var(--c-warn, #b06a00)">이을 상대 없음</text>
    <text x="322" y="163" font-size="11.5" fill="var(--c-warn, #b06a00)">(102는 참가 기록이 없다)</text>
  </g>
  <g>
    <path d="M469,194 L434,194" stroke="var(--c-warn, #b06a00)" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="428" y="212" font-size="11.5" text-anchor="end" fill="var(--c-warn, #b06a00)">104는 명단에 없다</text>
  </g>

  <!-- 아래 결론 -->
  <line x1="16" y1="266" x2="744" y2="266" stroke="var(--c-border, #dde4ec)" stroke-width="1"/>
  <text x="16" y="292" font-size="13" fill="var(--c-text, #16202b)">
    <tspan x="16" dy="0">두 표에 함께 있는 열이 공통 속성이고, 그 값이 같은 행끼리 이어진다.</tspan>
    <tspan x="16" dy="21">짝이 없는 행을 남길지 버릴지는 어느 표를 기준으로 삼는지에 따라 달라진다.</tspan>
    <tspan x="16" dy="21">그래서 통합하기 전에 기준을 먼저 정해야 한다.</tspan>
  </text>
</svg>
