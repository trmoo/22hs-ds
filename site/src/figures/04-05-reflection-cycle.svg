<svg viewBox="0 0 760 412" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>성찰에서 모델 수정으로 이어지는 순환</title>
  <desc>가운데에 목적, 수집, 전처리, 분석, 해석 다섯 단계가 원을 이루며 놓여 있다. 원의 바깥 왼쪽에는 성찰 질문 검토 지점이, 오른쪽 아래에는 사회적 영향 점검 검토 지점이 있다. 성찰 질문은 목적과 분석 단계로 되돌아가고, 사회적 영향 점검은 수집과 해석 단계로 되돌아간다. 원의 오른쪽에는 모델 수정, 재분석, 공유가 차례로 이어진다.</desc>
  <defs>
    <marker id="rfl-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--c-primary, #0d7d72)"/>
    </marker>
    <marker id="rfl-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--c-warn, #b06a00)"/>
    </marker>
    <marker id="rfl-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--c-accent, #1d5fd0)"/>
    </marker>
  </defs>

  <!-- 순환 원 -->
  <circle cx="266" cy="168" r="104" fill="none"
          stroke="var(--c-primary, #0d7d72)" stroke-width="2" stroke-dasharray="4 5" opacity="0.5"/>

  <!-- 다섯 단계: 원 위에 배치 -->
  <g>
    <rect x="214" y="42" width="104" height="34" rx="8" fill="var(--c-primary-soft, #d6f2ee)" stroke="var(--c-primary, #0d7d72)" stroke-width="1.6"/>
    <text x="266" y="64" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--c-text, #16202b)">목적</text>
  </g>
  <g>
    <rect x="330" y="122" width="104" height="34" rx="8" fill="var(--c-surface, #ffffff)" stroke="var(--c-primary, #0d7d72)" stroke-width="1.4"/>
    <text x="382" y="144" text-anchor="middle" font-size="12.5" fill="var(--c-text, #16202b)">수집</text>
  </g>
  <g>
    <rect x="290" y="248" width="104" height="34" rx="8" fill="var(--c-surface, #ffffff)" stroke="var(--c-primary, #0d7d72)" stroke-width="1.4"/>
    <text x="342" y="270" text-anchor="middle" font-size="12.5" fill="var(--c-text, #16202b)">전처리</text>
  </g>
  <g>
    <rect x="142" y="248" width="104" height="34" rx="8" fill="var(--c-surface, #ffffff)" stroke="var(--c-primary, #0d7d72)" stroke-width="1.4"/>
    <text x="194" y="270" text-anchor="middle" font-size="12.5" fill="var(--c-text, #16202b)">분석</text>
  </g>
  <g>
    <rect x="98" y="122" width="104" height="34" rx="8" fill="var(--c-primary-soft, #d6f2ee)" stroke="var(--c-primary, #0d7d72)" stroke-width="1.6"/>
    <text x="150" y="144" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--c-text, #16202b)">해석</text>
  </g>

  <!-- 순환 화살표 (시계 방향) -->
  <g fill="none" stroke="var(--c-primary, #0d7d72)" stroke-width="2" marker-end="url(#rfl-a)">
    <path d="M320,74 C344,86 360,102 372,118"/>
    <path d="M382,160 C376,196 366,222 356,244"/>
    <path d="M290,282 C276,288 260,288 248,282"/>
    <path d="M162,248 C150,224 142,196 142,162"/>
    <path d="M158,120 C176,98 192,84 212,74"/>
  </g>

  <!-- 검토 지점 1: 성찰 질문 -->
  <g>
    <rect x="16" y="24" width="118" height="54" rx="9"
          fill="none" stroke="var(--c-warn, #b06a00)" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="75" y="46" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--c-warn, #b06a00)">성찰 질문</text>
    <text x="75" y="65" text-anchor="middle" font-size="10.5" fill="var(--c-warn, #b06a00)">근거가 충분한가</text>
  </g>
  <g fill="none" stroke="var(--c-warn, #b06a00)" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#rfl-w)">
    <path d="M134,44 L208,54"/>
    <path d="M75,84 C75,180 100,246 138,262"/>
  </g>
  <text x="90" y="176" font-size="10" fill="var(--c-warn, #b06a00)">분석으로</text>

  <!-- 검토 지점 2: 사회적 영향 점검 -->
  <g>
    <rect x="368" y="318" width="164" height="54" rx="9"
          fill="none" stroke="var(--c-warn, #b06a00)" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="450" y="340" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--c-warn, #b06a00)">사회적 영향 점검</text>
    <text x="450" y="359" text-anchor="middle" font-size="10.5" fill="var(--c-warn, #b06a00)">누구에게 불리하게 쓰일 수 있는가</text>
  </g>
  <g fill="none" stroke="var(--c-warn, #b06a00)" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#rfl-w)">
    <path d="M400,318 C412,250 404,180 400,160"/>
    <path d="M368,344 C240,344 168,300 156,160"/>
  </g>
  <text x="410" y="240" font-size="10" fill="var(--c-warn, #b06a00)">수집으로</text>
  <text x="212" y="336" font-size="10" fill="var(--c-warn, #b06a00)">해석으로</text>

  <!-- 오른쪽: 모델 수정 → 재분석 → 공유 -->
  <path d="M440,139 L484,139" fill="none" stroke="var(--c-accent, #1d5fd0)" stroke-width="2" marker-end="url(#rfl-b)"/>
  <g>
    <rect x="490" y="40" width="130" height="42" rx="9"
          fill="var(--c-accent-soft, #dce7fb)" stroke="var(--c-accent, #1d5fd0)" stroke-width="1.7"/>
    <text x="555" y="66" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--c-text, #16202b)">모델 수정</text>
  </g>
  <g>
    <rect x="490" y="118" width="130" height="42" rx="9"
          fill="var(--c-accent-soft, #dce7fb)" stroke="var(--c-accent, #1d5fd0)" stroke-width="1.7"/>
    <text x="555" y="144" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--c-text, #16202b)">재분석</text>
  </g>
  <g>
    <rect x="490" y="196" width="130" height="42" rx="9"
          fill="var(--c-accent-soft, #dce7fb)" stroke="var(--c-accent, #1d5fd0)" stroke-width="1.7"/>
    <text x="555" y="222" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--c-text, #16202b)">공유</text>
  </g>
  <g fill="none" stroke="var(--c-accent, #1d5fd0)" stroke-width="2" marker-end="url(#rfl-b)">
    <path d="M555,84 L555,112"/>
    <path d="M555,162 L555,190"/>
  </g>
  <text x="644" y="60" font-size="11" fill="var(--c-text-soft, #4a5768)">
    <tspan x="644" dy="0">점검에서</tspan>
    <tspan x="644" dy="16">나온 문제를</tspan>
    <tspan x="644" dy="16">고친다</tspan>
  </text>
  <text x="644" y="145" font-size="11" fill="var(--c-text-soft, #4a5768)">
    <tspan x="644" dy="0">고친 뒤</tspan>
    <tspan x="644" dy="16">다시 돌린다</tspan>
  </text>
  <text x="644" y="215" font-size="11" fill="var(--c-text-soft, #4a5768)">
    <tspan x="644" dy="0">고친 내용을</tspan>
    <tspan x="644" dy="16">함께 밝힌다</tspan>
  </text>

  <!-- 아래 결론 -->
  <line x1="16" y1="382" x2="744" y2="382" stroke="var(--c-border, #dde4ec)" stroke-width="1"/>
  <text x="16" y="398" font-size="12.5" fill="var(--c-text, #16202b)">성찰은 마지막에 쓰는 감상이 아니라, 어느 단계로 돌아갈지 정하는 판단이다.</text>
</svg>
